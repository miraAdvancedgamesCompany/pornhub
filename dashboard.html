<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Oops:) Studio — Video & Content Management Dashboard">
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#000000">

    <title>Oops:) Studio — Content Dashboard</title>

    <!-- Favicon -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎬</text></svg>">

    <!-- Styles -->
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/dashboard.css">
</head>
<body class="dashboard-body">
    <div class="dash-wrapper">
        <!-- ====== Dashboard Header ====== -->
        <header class="dash-navbar">
            <div class="dash-brand">
                <span class="dash-brand-logo">Oops:)</span>
                <span class="dash-brand-badge">Studio</span>
            </div>
            <div class="dash-header-actions">
                <a href="index.html" target="_blank" class="dash-preview-app-btn">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path>
                        <polyline points="15 3 21 3 21 9"></polyline>
                        <line x1="10" y1="14" x2="21" y2="3"></line>
                    </svg>
                    Preview App
                </a>
            </div>
        </header>

        <main class="dash-main-container">
            <!-- ====== Top Stats Row ====== -->
            <section class="dash-stats-grid">
                <div class="dash-stat-card">
                    <div class="stat-icon-wrapper purple">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect>
                            <path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path>
                        </svg>
                    </div>
                    <div class="stat-info">
                        <div class="stat-value" id="statTotal">0</div>
                        <div class="stat-name">Total Items</div>
                    </div>
                </div>

                <div class="dash-stat-card">
                    <div class="stat-icon-wrapper pink">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <polygon points="23 7 16 12 23 17 23 7"></polygon>
                            <rect x="1" y="5" width="15" height="14" rx="2" ry="2"></rect>
                        </svg>
                    </div>
                    <div class="stat-info">
                        <div class="stat-value" id="statVideos">0</div>
                        <div class="stat-name">Videos & Reels</div>
                    </div>
                </div>

                <div class="dash-stat-card">
                    <div class="stat-icon-wrapper blue">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                            <circle cx="8.5" cy="8.5" r="1.5"></circle>
                            <polyline points="21 15 16 10 5 21"></polyline>
                        </svg>
                    </div>
                    <div class="stat-info">
                        <div class="stat-value" id="statImages">0</div>
                        <div class="stat-name">Photos</div>
                    </div>
                </div>

                <div class="dash-stat-card">
                    <div class="stat-icon-wrapper orange">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M22 12h-4l-3 9L9 3l-3 9H2"></path>
                        </svg>
                    </div>
                    <div class="stat-info">
                        <div class="stat-value" style="color:#10b981;">Online</div>
                        <div class="stat-name">Firebase Realtime DB</div>
                    </div>
                </div>
            </section>

            <!-- ====== Upload Section ====== -->
            <section class="dash-card upload-card">
                <div class="dash-card-header">
                    <div class="dash-card-title">
                        <span class="title-icon">➕</span>
                        <h2>Upload New Media</h2>
                    </div>
                    <button type="button" id="seedDbBtn" class="seed-action-btn" title="Push sample videos to Firebase">
                        ⚡ Quick Seed Sample Videos
                    </button>
                </div>

                <form id="uploadForm" class="dash-form">
                    <div class="form-grid">
                        <div class="form-field">
                            <label for="contentType">Media Type</label>
                            <select id="contentType" class="dash-input select-input">
                                <option value="video">🎬 Video (MP4 / WebM / Link)</option>
                                <option value="image">🖼️ Image (JPG / PNG / WebP)</option>
                            </select>
                        </div>

                        <div class="form-field">
                            <label for="contentTitle">Title / Headline</label>
                            <input type="text" id="contentTitle" class="dash-input" placeholder="e.g. Sunset in Venice Beach 🌅" required>
                        </div>
                    </div>

                    <div class="form-field">
                        <label for="contentUrl">Direct Media URL (Video or Photo link)</label>
                        <div class="input-with-clear">
                            <input
                                type="url"
                                id="contentUrl"
                                class="dash-input"
                                placeholder="https://assets.example.com/video.mp4"
                                required
                            >
                            <button type="button" id="clearUrlBtn" class="clear-btn" title="Clear">✕</button>
                        </div>
                        <span class="field-hint">Paste any direct public MP4 video or image link.</span>
                    </div>

                    <!-- Live Media Preview Box -->
                    <div id="urlPreviewBox" class="preview-box">
                        <div class="preview-header">
                            <span>Live Media Preview</span>
                            <span id="previewTypeBadge" class="preview-badge">video</span>
                        </div>
                        <div id="previewMediaContainer" class="preview-media-container"></div>
                    </div>

                    <div class="form-field">
                        <label for="contentDesc">Caption & Hashtags (optional)</label>
                        <textarea id="contentDesc" class="dash-input textarea-input" rows="2" placeholder="e.g. Enjoying the moment #reels #explore #vibes"></textarea>
                    </div>

                    <div class="form-footer">
                        <div id="uploadStatusMsg" class="upload-status-msg"></div>
                        <button type="submit" id="submitBtn" class="primary-submit-btn">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                                <polyline points="17 8 12 3 7 8"></polyline>
                                <line x1="12" y1="3" x2="12" y2="15"></line>
                            </svg>
                            <span>Publish to Realtime Database</span>
                        </button>
                    </div>
                </form>
            </section>

            <!-- ====== Content Library Section ====== -->
            <section class="dash-card library-card">
                <div class="dash-card-header library-header">
                    <div class="dash-card-title">
                        <span class="title-icon">📁</span>
                        <h2>Content Library</h2>
                        <span id="libraryCountBadge" class="count-pill">0</span>
                    </div>

                    <div class="library-toolbar">
                        <div class="search-box">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <circle cx="11" cy="11" r="8"></circle>
                                <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                            </svg>
                            <input type="text" id="librarySearchInput" placeholder="Search by title or caption...">
                        </div>

                        <div class="filter-group">
                            <button type="button" class="lib-filter-btn active" data-type="all">All</button>
                            <button type="button" class="lib-filter-btn" data-type="video">Videos</button>
                            <button type="button" class="lib-filter-btn" data-type="image">Images</button>
                        </div>
                    </div>
                </div>

                <div id="libraryContainer" class="library-grid">
                    <div class="loading-state">
                        <div class="loading-spinner"></div>
                        <p>Syncing with Firebase Realtime Database...</p>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <!-- Notification Toast -->
    <div id="dashToast" class="dash-toast"></div>

    <!-- Dashboard Module -->
    <script type="module" src="js/dashboard.js"></script>
</body>
</html>
